[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers
markers =
    unit: Pruebas unitarias aisladas (modelos, helpers, reglas de negocio y repositorios sin HTTP/navegador).
    integration: Pruebas de integración con SQLite real, API REST Flask y concurrencia.
    e2e: Pruebas End-to-End de interfaz web con Playwright sobre Microsoft Edge local.
